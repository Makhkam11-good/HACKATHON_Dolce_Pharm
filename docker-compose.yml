name: dolcepharm-lms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms} -d ${POSTGRES_DB:-lms}"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lms}:${POSTGRES_PASSWORD:-lms}@db:5432/${POSTGRES_DB:-lms}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-env-file}
      JWT_TTL_DAYS: ${JWT_TTL_DAYS:-7}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      SEED_DEMO: ${SEED_DEMO:-1}
    volumes:
      - storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  # Сборка фронтенда (multi-stage) + раздача статики и прокси /api по HTTPS
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - backend

volumes:
  pgdata:
  storage:
