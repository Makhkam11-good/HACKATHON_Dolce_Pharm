# Cloudflare Tunnel (cloudflared → http://nginx:80) передаёт X-Forwarded-Proto: https.
# Такие запросы обслуживаем по HTTP без редиректа: HTTPS для браузера уже обеспечивает Cloudflare.
# Прямые HTTP-запросы из LAN заголовка не имеют — их, как и раньше, отправляем на HTTPS
# (без HTTPS на телефоне не работают Service Worker, камера и WebCrypto).
map $http_x_forwarded_proto $via_tunnel {
    default 0;
    https   1;
}

server {
    listen 80;
    server_name _;
    set $fwd_proto https;

    if ($via_tunnel = 0) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/snippets/app-locations.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    set $fwd_proto https;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    include /etc/nginx/snippets/app-locations.conf;
}
