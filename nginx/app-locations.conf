# Общие настройки и маршруты приложения — подключаются и в HTTPS (443), и в HTTP (80, для Cloudflare Tunnel).
# Ожидает, что в server-блоке задана переменная $fwd_proto (схема, которую видит браузер).

client_max_body_size 320m;
root /usr/share/nginx/html;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
    add_header Cache-Control "no-store" always;
}

# service worker и манифест — всегда свежие
location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { application/manifest+json webmanifest; }
    try_files $uri =404;
}
# воркер pdf.js — ES-модуль .mjs; без явного типа nginx отдаёт octet-stream и браузер его не загрузит
location ~ \.mjs$ {
    types { }
    default_type application/javascript;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}
location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}
